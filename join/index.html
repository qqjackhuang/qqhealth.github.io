<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>四个入驻入口 · 亲情管家</title>
  <link rel="stylesheet" href="css/form.css">
  <style>
    .grid { display: grid; gap: 12px; }
    .role-link {
      display: block;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
    }
    .role-link .cover { height: 110px; position: relative; }
    .role-link img { width: 100%; height: 110px; object-fit: cover; }
    .role-link .cover span {
      position: absolute; left: 14px; bottom: 12px; color: #fff; font-weight: 700; font-size: 18px;
    }
    .role-link .body { padding: 12px 14px 14px; color: var(--ink-soft); font-size: 13px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topnav"><a href="../index.html">‹ 小程序首页</a><a href="../cms/index.html">CMS 后台</a></div>
    <h1 style="font-size:24px;margin-bottom:8px;">选择你的角色</h1>
    <p class="intro" style="margin-bottom:16px;">四个网页收集的内容不同，提交后都进入 CMS 的同一集合「入驻申请」。</p>
    <div class="grid" id="grid"></div>
  </div>
  <script src="../assets/js/roles.js"></script>
  <script>
    document.getElementById("grid").innerHTML = QINQING_ROLES.map(function (role) {
      return '<a class="role-link" href="' + role.id + '.html">' +
        '<div class="cover"><img src="../assets/images/' + role.banner + '" alt=""><span>' + role.title + "</span></div>" +
        '<div class="body">' + role.subtitle + " · " + role.desc + "</div></a>";
    }).join("");
  </script>
</body>
</html>
